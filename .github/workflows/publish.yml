# Trusted (OIDC) publish of the canary package. npm accepts it only if the package's trusted
# publisher on npmjs.com names this file and the `npm` environment.
name: publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@11.21.2 # trusted publishing needs >= 11.5.1
      - name: Publish
        env:
          VERSION: ${{ inputs.version }}
        run: |
          npm pkg set version="$VERSION"
          npm publish
