# Trusted (OIDC) publish of the canary package. npm accepts it only if the package's trusted
# publisher on npmjs.com names this file and the `npm` environment, so both triggers live here.
#
# - push to main: publishes the version in package.json, skipped if npm already has it.
# - workflow_dispatch: publishes the given version (or package.json's if left empty).
name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish (empty = package.json version)
        required: false

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@11.21.2 # trusted publishing needs >= 11.5.1
      - name: Set version
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
        run: npm pkg set version="$VERSION"
      - name: Check whether version is already published
        id: check
        run: |
          name=$(npm pkg get name | tr -d '"')
          version=$(npm pkg get version | tr -d '"')
          if [ -n "$(npm view "$name@$version" version 2>/dev/null)" ]; then
            echo "::notice::$name@$version is already on npm; skipping publish"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Publishing $name@$version"
          fi
      - name: Publish
        if: steps.check.outputs.skip != 'true'
        run: npm publish
